[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dme-pipeline"
version = "1.0"
description = "ETL pipeline for Data Management Engineering"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "gdown",
    "pyarrow",
    "psycopg2-binary",
]

[tool.setuptools.packages.find]
where = ["src"]
